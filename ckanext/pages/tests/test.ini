[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = paste@localhost

[app:main]
use = config:/usr/lib/ckan/default/src/ckan/test-core.ini

## A hardcoded SESSION_COOKIE_DOMAIN must match whatever host the test
## client's requests actually target, or the session cookie set on one
## request never gets sent back on the next - breaking anything that reads
## the session (redirects with a flash message, e.g. revision restore).
## That host isn't fixed across our test environments though: in our Docker
## stacks a real CKAN_SITE_URL env var overrides ckan.site_url (via
## ckanext-envvars) to localhost, while on a real native deploy nothing
## overrides it and it stays at test-core.ini's own default,
## test.ckan.net - confirmed via diagnostic prints, request.host differed
## between the two. No fixed value works everywhere, so the goal is no
## Domain attribute at all (a host-only cookie, which always matches
## whatever host actually set it). Simply removing this line isn't enough:
## test-core.ini (which we chain from) hardcodes its own
## SESSION_COOKIE_DOMAIN=test.ckan.net, so leaving this unset here just
## inherits that instead of getting a true unset. Set it explicitly empty
## to override that inherited value - Flask treats an empty string as
## falsy and omits the Domain attribute.
SESSION_COOKIE_DOMAIN =

ckan.plugins = pages image_view

ckanext.pages.organization = True
ckanext.pages.group = True

sqlalchemy.url = postgresql://ckan:%(CKAN_DB_PASSWORD)s@%(CKAN_DB_HOST)s:%(CKAN_DB_PORT)s/ckan_test
ckan.datastore.write_url = postgresql://ckan_datastore:%(CKAN_DATASTORE_DB_PASSWORD)s@%(CKAN_DB_HOST)s:%(CKAN_DB_PORT)s/datastore_test
ckan.datastore.read_url = postgresql://ckan_datastore_ro:%(CKAN_DATASTORE_READONLY_PASSWORD)s@%(CKAN_DB_HOST)s:%(CKAN_DB_PORT)s/datastore_test

[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
